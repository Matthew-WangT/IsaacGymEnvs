params:
  seed: ${...seed}

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True

    mlp:
      units: [256, 128, 64]  # 4090D专用：大幅增加网络容量
      activation: elu
      d2rl: False
      
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: ${if:${...checkpoint},True,False}
  load_path: ${...checkpoint}

  config:
    name: ${resolve_default:R3RobotReach,${....experiment}}
    full_experiment_name: ${.name}
    env_name: rlgpu
    multi_gpu: ${....multi_gpu}
    ppo: True
    mixed_precision: True  # 4090D支持：启用混合精度训练
    
    # TensorBoard配置
    train_dir: ./outputs/${.name}
    log_dir: ./outputs/${.name}/logs
    use_tensorboard: True
    tensorboard_freq: 1  # 每个epoch记录一次
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: ${....task.env.numEnvs}
    reward_shaper:
      scale_value: 0.1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 3e-4  # 4090D专用：提高学习率以加速训练
    lr_schedule: adaptive
    schedule_type: legacy
    kl_threshold: 0.008
    score_to_win: 30000  
    max_epochs: 50000    # 4090D专用：大幅增加训练轮数
    save_best_after: 50
    save_frequency: 100
    grad_norm: 1.0
    entropy_coef: 0.01   
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 32   # 4090D专用：大幅增加视界长度
    minibatch_size: 16384 # 4090D专用：大批次训练
    mini_epochs: 8       # 4090D专用：增加mini epochs
    critic_coef: 2
    clip_value: True
    seq_len: 4
    bounds_loss_coef: 0.0001 